# The CI gate (.pal-harness/practices/devops_cicd.md, **The CI gate**). Copy this file to
# .github/workflows/ci.yml, list in gate.with.jobs every path each job reads, and replace the
# example job with the repo's own. A job is skipped when the files it reads already passed CI.
# A harness re-pin moves both @v<version> lines and version: together.
name: ci
on:
  pull_request:
  push:
    branches: [dev, staging, main]
  workflow_dispatch:
# A newer push to the same PR or branch cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gate:
    uses: althenlimzixuan/pal-harness/.github/workflows/ci-gate.yml@v1.8.0
    with:
      version: 1.8.0
      # One line per job: "<job>: <every path it reads>" (code, build files, lint config, a
      # contract copy its drift check compares). .github/workflows/ci.yml is always included.
      jobs: |
        api: cmd internal pkg migrations go.mod go.sum Makefile .golangci.yml .mockery.yaml
  # Runs unless the gate said skip. A gate that failed or never started (no GitHub minutes left)
  # runs everything.
  api:
    needs: gate
    if: ${{ !cancelled() && fromJSON(needs.gate.outputs.decisions || '{}').api != 'skip' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      - run: go build ./...
      - run: make test
      - name: Generated code drift
        run: |
          make wire
          git diff --exit-code
  # A heavy Windows job may run on the self-hosted runner: set the repository variable
  # WINDOWS_RUNNER to its label (devops_cicd.md, **Self-hosted runners**), with
  #   runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
  # Records each job that passed, so the same files are not tested again.
  mark:
    needs: [gate, api]
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    permissions:
      contents: write
    uses: althenlimzixuan/pal-harness/.github/workflows/ci-mark.yml@v1.8.0
    with:
      fingerprints: ${{ needs.gate.outputs.fingerprints }}
      results: ${{ toJSON(needs) }}
