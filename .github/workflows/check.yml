name: check
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go run github.com/althenlimzixuan/pal-harness/cmd/pal-harness@v${{ inputs.version }} check .
