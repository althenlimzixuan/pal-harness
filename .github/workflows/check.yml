name: check
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the harness version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$VERSION" =~ $re ]]; then
            echo "invalid harness version: $VERSION" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - name: pal-harness check
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: go run "github.com/althenlimzixuan/pal-harness/cmd/pal-harness@v${VERSION}" check .
